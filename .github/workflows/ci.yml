name: serpapi-ruby
on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master ]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Ruby series in normal maintenance. Tests call the live SerpApi API,
        # so each added version uses more search credits.
        ruby-version: ['3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Install dependencies
        run: bundle install
      - name: lint
        run: bundle exec rake lint
      - name: tests
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: bundle exec rake test
      - name: oobt
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: bundle exec rake oobt
